<title>Tira times</title>
<meta name="theme-color" content="#f4f7f2">
<meta name="description" content="Sorteie times de pelada equilibrados por nota, características e posições. Grátis, no navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0..1,0&display=block">
<style>
/* Design system Pelada — tokens (tema claro, escolhido de propósito: gramado com fundo claro) */
:root{color-scheme:light;--surface-000:#ffffff;--surface-100:#f4f7f2;--surface-200:#e8eee5;--line:#d6dfd2;--line-strong:#8a9a8d;--ink:#15231a;--ink-muted:#56665a;--pitch-100:#dcefe1;--pitch-600:#1b7a3e;--pitch-700:#135f2f;--pitch-900:#0b3a1d;--on-pitch:#ffffff;--gold-500:#f2a900;--gold-700:#a86f00;--gold-100:#fff0c7;--gold-800:#6b4700;--team-verde:#1b7a3e;--team-azul:#1f5fbf;--team-laranja:#c2410c;--team-grafite:#2f3538;--team-vermelho:#a8231b;--team-amarelo:#f2c200;--danger:#b3261e;--warn-100:#fde7d9;--warn-700:#8f3408;--scrim:rgba(21, 35, 26, 0.45);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--radius-sm:8px;--radius-md:14px;--radius-lg:22px;--radius-pill:999px;--shadow-1:0 1px 2px rgba(21, 35, 26, 0.06), 0 1px 3px rgba(21, 35, 26, 0.08);--shadow-2:0 6px 20px rgba(21, 35, 26, 0.16);--font-sans:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-icons:"Material Symbols Rounded";}

body { margin: 0; font-family: var(--font-sans); color: var(--ink); background: var(--surface-100); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }

.pl-icon { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24; user-select: none; flex: none; }
.pl-icon-fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

/* Botões */
.pl-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--radius-pill); font-size: 14px; font-weight: 700; letter-spacing: .2px; cursor: pointer; white-space: nowrap; transition: background .15s, transform .1s; }
.pl-btn:active { transform: scale(.98); }
.pl-btn:disabled { opacity: .45; cursor: default; }
.pl-btn .pl-icon { font-size: 20px; }
.pl-btn-primary { background: var(--pitch-600); color: var(--on-pitch); }
.pl-btn-primary:hover { background: var(--pitch-700); }
.pl-btn-tonal { background: var(--pitch-100); color: var(--pitch-700); }
.pl-btn-outline { background: var(--surface-000); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pl-btn-ghost { background: transparent; color: var(--pitch-700); padding: 0 12px; }
.pl-btn-danger { background: transparent; color: var(--danger); padding: 0 12px; }
.pl-btn-fab { background: var(--pitch-600); color: var(--on-pitch); min-height: 56px; padding: 0 22px 0 18px; border-radius: 18px; box-shadow: var(--shadow-2); font-size: 15px; }
.pl-btn-fab .pl-icon { font-size: 24px; }
.pl-btn-lg { min-height: 56px; font-size: 16px; padding: 0 28px; }
.pl-btn-lg .pl-icon { font-size: 24px; }
.pl-btn-block { width: 100%; }
.pl-iconbtn { width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
.pl-iconbtn:hover { background: var(--surface-200); }

/* Selos */
.pl-badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; }
.pl-badge .pl-icon { font-size: 16px; }
.pl-badge-monthly { background: var(--gold-100); color: var(--gold-800); }
.pl-badge-guest, .pl-badge-neutral { background: var(--surface-200); color: var(--ink-muted); }
.pl-badge-gk { background: var(--pitch-100); color: var(--pitch-700); }
.pl-badge-warn { background: var(--warn-100); color: var(--warn-700); }

/* Avatar */
.pl-avatar { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-200); color: var(--ink); font-weight: 800; font-size: 15px; flex: none; transition: background .15s; }
.pl-avatar-gk { background: var(--pitch-100); color: var(--pitch-700); }
.pl-avatar-on { background: var(--pitch-600); color: var(--on-pitch); }

/* Campo */
.pl-field { display: flex; flex-direction: column; gap: 6px; }
.pl-field-label { font-size: 13px; font-weight: 700; color: var(--ink-muted); }
.pl-field-box { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: var(--surface-000); border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); color: var(--ink-muted); }
.pl-field-box:focus-within { border-color: var(--pitch-600); box-shadow: 0 0 0 3px var(--pitch-100); }
.pl-field-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 600 16px var(--font-sans); color: var(--ink); }
.pl-field-box input::placeholder { color: var(--ink-muted); font-weight: 500; }
.pl-field-hint { font-size: 12px; color: var(--ink-muted); font-weight: 600; }

/* Estrelas */
.pl-stars { display: inline-flex; gap: 2px; }
.pl-star { width: 36px; height: 36px; padding: 0; border: 0; background: transparent; display: inline-grid; place-items: center; cursor: pointer; color: var(--line-strong); border-radius: 50%; }
.pl-star .pl-icon { font-size: 30px; }
.pl-star-on { color: var(--gold-500); }
.pl-star-on .pl-icon { text-shadow: 0 0 1px var(--gold-700), 0 0 1px var(--gold-700); }
span.pl-star { cursor: default; }
.pl-stars-sm .pl-star { width: 18px; height: 18px; }
.pl-stars-sm .pl-star .pl-icon { font-size: 18px; }
.pl-rating { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.pl-rating-label { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
.pl-rating-label .pl-icon { color: var(--ink-muted); font-size: 20px; }

/* Chips de posição */
.pl-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pl-chip { display: inline-flex; align-items: center; gap: 4px; height: 38px; padding: 0 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--line); background: var(--surface-000); font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer; transition: all .12s; }
.pl-chip .pl-icon { font-size: 18px; margin-left: -4px; }
.pl-chip-on { background: var(--pitch-100); border-color: var(--pitch-600); color: var(--pitch-700); }

/* Switch */
.pl-switch { width: 52px; height: 32px; border-radius: var(--radius-pill); border: 2px solid var(--line-strong); background: var(--surface-200); padding: 0; position: relative; cursor: pointer; transition: all .15s; flex: none; }
.pl-switch-thumb { position: absolute; top: 50%; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: var(--line-strong); transform: translateY(-50%); transition: all .15s; display: grid; place-items: center; }
.pl-switch-on { background: var(--pitch-600); border-color: var(--pitch-600); }
.pl-switch-on .pl-switch-thumb { left: 22px; width: 24px; height: 24px; background: var(--on-pitch); color: var(--pitch-700); }
.pl-switch-thumb .pl-icon { font-size: 16px; }
.pl-toggle-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-000); border: 1.5px solid var(--line); cursor: pointer; transition: all .15s; }
.pl-toggle-row-on { border-color: var(--gold-500); background: #fffaf0; }
.pl-toggle-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-200); color: var(--ink-muted); flex: none; }
.pl-toggle-row-on .pl-toggle-icon { background: var(--gold-100); color: var(--gold-800); }
.pl-toggle-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.pl-toggle-title { font-size: 15px; font-weight: 700; }
.pl-toggle-hint { font-size: 12px; font-weight: 600; color: var(--ink-muted); }

/* Linha de jogador */
.pl-player { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md); cursor: pointer; transition: background .12s; user-select: none; }
.pl-player:hover { background: var(--surface-200); }
.pl-player-on, .pl-player-on:hover { background: var(--pitch-100); }
.pl-player-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pl-player-name { display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-player-mono { color: var(--gold-500); font-size: 18px; text-shadow: 0 0 1px var(--gold-700); }
.pl-player-meta { display: flex; align-items: center; gap: 6px; }
.pl-pos { font-size: 11px; font-weight: 800; letter-spacing: .4px; color: var(--ink-muted); background: var(--surface-200); padding: 2px 6px; border-radius: 6px; }
.pl-player-on .pl-pos { background: var(--surface-000); }
.pl-pos-gk { background: var(--pitch-100); color: var(--pitch-700); }
.pl-player-rate { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--ink-muted); margin-left: 2px; }
.pl-player-rate .pl-icon { font-size: 15px; color: var(--gold-500); }
.pl-player-go { color: var(--ink-muted); }
.pl-check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; transition: all .12s; }
.pl-check-on { background: var(--pitch-600); border-color: var(--pitch-600); color: var(--on-pitch); }
.pl-check .pl-icon { font-size: 20px; }

/* Stepper */
.pl-stepper { display: flex; align-items: center; gap: 12px; padding: 14px 0; }
.pl-stepper-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pl-stepper-label { font-size: 15px; font-weight: 700; }
.pl-stepper-hint { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.pl-stepper-ctl { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-200); border-radius: var(--radius-pill); padding: 4px; }
.pl-stepper-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-000); color: var(--ink); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow-1); }
.pl-stepper-plus { background: var(--pitch-600); color: var(--on-pitch); }
.pl-stepper-btn:disabled { opacity: .35; cursor: default; }
.pl-stepper-val { min-width: 44px; text-align: center; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }

/* Card de time */
.pl-team { background: var(--surface-000); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-1); }
.pl-team-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; color: var(--on-pitch); }
.pl-team-name { font-size: 18px; font-weight: 800; flex: 1; }
.pl-team-meta { font-size: 12px; font-weight: 700; opacity: .9; }
.pl-team-power { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 800; background: rgba(255,255,255,.2); padding: 3px 8px; border-radius: var(--radius-pill); }
.pl-team-power .pl-icon { font-size: 16px; }
.pl-team-verde { background: var(--team-verde); }
.pl-team-azul { background: var(--team-azul); }
.pl-team-laranja { background: var(--team-laranja); }
.pl-team-grafite { background: var(--team-grafite); }
.pl-team-vermelho { background: var(--team-vermelho); }
.pl-team-amarelo { background: var(--team-amarelo); color: var(--ink); }
.pl-team-amarelo .pl-team-power { background: rgba(0,0,0,.1); }
.pl-team-gk { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 14px; font-weight: 700; color: var(--pitch-700); background: var(--pitch-100); }
.pl-team-gk .pl-icon { font-size: 18px; }
.pl-team-list { list-style: none; margin: 0; padding: 6px 0; }
.pl-team-list li { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 15px; }
.pl-team-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pl-team-player { flex: 1; font-weight: 700; }
.pl-team-pos { font-size: 11px; font-weight: 800; letter-spacing: .4px; color: var(--ink-muted); }
.pl-team-list li.pl-team-open { margin: 4px 12px 6px; padding: 8px 10px; border: 1.5px dashed var(--warn-700); border-radius: var(--radius-sm); background: var(--warn-100); color: var(--warn-700); font-size: 13px; font-weight: 700; }
.pl-team-open .pl-icon { font-size: 18px; }

/* App bar */
.pl-appbar { display: flex; align-items: center; gap: 4px; min-height: 64px; padding: 8px 8px 8px 16px; background: var(--surface-100); }
.pl-appbar-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.pl-appbar-title { font-size: 20px; font-weight: 800; line-height: 26px; }
.pl-appbar-sub { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.pl-appbar-lg { align-items: flex-start; padding-top: 12px; }
.pl-appbar-lg .pl-appbar-title { font-size: 28px; line-height: 34px; letter-spacing: -.5px; }
.pl-appbar .pl-iconbtn:first-child { margin-left: -8px; }

/* Navegação inferior */
.pl-nav { display: flex; background: var(--surface-000); border-top: 1px solid var(--line); padding: 10px 4px 14px; }
.pl-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; cursor: pointer; color: var(--ink-muted); }
.pl-nav-pill { position: relative; width: 60px; height: 32px; border-radius: var(--radius-pill); display: grid; place-items: center; transition: background .15s; }
.pl-nav-label { font-size: 12px; font-weight: 700; }
.pl-nav-on { color: var(--ink); }
.pl-nav-on .pl-nav-pill { background: var(--pitch-100); color: var(--pitch-700); }
.pl-nav-badge { position: absolute; top: -2px; right: 8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pitch-600); color: var(--on-pitch); font-size: 11px; font-weight: 800; display: grid; place-items: center; box-sizing: border-box; }

/* Moldura de tela (showcase) */
.pl-stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 24px 0; background: var(--surface-200); box-sizing: border-box; }
.pl-phone { width: 360px; height: 760px; border-radius: 36px; background: var(--surface-100); overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 0 10px #15231a, 0 20px 50px rgba(21,35,26,.25); }
.pl-statusbar { height: 28px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 700; }
.pl-statusbar .pl-icon { font-size: 16px; }
.pl-screen { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
.pl-screen > * { flex-shrink: 0; }
.pl-screen::-webkit-scrollbar { display: none; }
.pl-section-title { font-size: 13px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase; color: var(--ink-muted); margin: 20px 4px 8px; }
.pl-card { background: var(--surface-000); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 4px 16px; box-shadow: var(--shadow-1); }
.pl-card + .pl-card { margin-top: 12px; }
.pl-divider { height: 1px; background: var(--line); margin: 0; border: 0; }
.pl-dock { flex: none; padding: 12px 16px; background: var(--surface-100); border-top: 1px solid var(--line); }
.pl-player + .pl-player { margin-top: 4px; }

/* Perfil do time (equilíbrio de características e posições) */
.pl-team-prof { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.pl-team-meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.pl-meter { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pl-meter-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: .4px; color: var(--ink-muted); }
.pl-meter-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.pl-meter-track { height: 6px; border-radius: 3px; background: var(--surface-200); overflow: hidden; }
.pl-meter-fill { display: block; height: 100%; border-radius: 3px; }
.pl-team-roles { display: flex; gap: 6px; flex-wrap: wrap; }
.pl-role { display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 8px 0 5px; border-radius: var(--radius-sm); background: var(--pitch-100); color: var(--pitch-700); font-size: 11px; font-weight: 800; letter-spacing: .3px; }
.pl-role .pl-icon { font-size: 16px; }
.pl-role-miss { background: var(--warn-100); color: var(--warn-700); }

/* Layout: web mobile first — no celular ocupa a tela; no desktop, coluna de app centralizada. O site de conteúdo rola livre. */
html, body { height: 100%; }
body { background: var(--surface-200); overflow: hidden; }
#root { height: 100%; }
.tt-device { height: 100%; display: flex; align-items: center; justify-content: center; }
.tt-app { position: relative; width: 100%; height: 100%; max-width: 420px; background: var(--surface-100); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 560px) {
  body { background: var(--surface-200); }
  .tt-app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); box-shadow: 0 0 40px rgba(21,35,26,.08); }
}
.tt-main { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: tt-in .18s ease-out; }
@keyframes tt-in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .tt-main, .tt-sheet, .tt-toast { animation: none !important; } }
.pl-nav { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
:focus-visible { outline: 3px solid var(--pitch-600); outline-offset: 2px; }

/* Marca */
.tt-brandbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 0 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
.tt-brand { display: flex; align-items: center; gap: 10px; }
.tt-logo { position: relative; width: 34px; height: 34px; border-radius: 11px; background: var(--pitch-600); overflow: hidden; flex: none; }
.tt-logo-a { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--pitch-100); }
.tt-logo-b { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--pitch-100); box-sizing: border-box; background: var(--pitch-600); }
.tt-brand-name { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.3px; line-height: 20px; }
.tt-brand-group { display: block; font-size: 12px; font-weight: 600; color: var(--ink-muted); }
.tt-titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; flex-wrap: wrap; }
.tt-h1 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -.5px; }
.tt-count { font-size: 12px; font-weight: 700; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.tt-pad { padding: 0 16px 8px; }
.tt-listpad { padding-bottom: 96px; }
.tt-fab { position: absolute; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.pl-appbar { padding-top: calc(8px + env(safe-area-inset-top, 0px)); }

/* Presença */
.tt-stats { display: flex; gap: 10px; padding: 0 16px 10px; }
.tt-stat { flex: 1; background: var(--surface-000); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 10px 14px; }
.tt-stat-main { background: var(--pitch-600); border-color: var(--pitch-600); color: var(--on-pitch); }
.tt-stat-n { font-size: 28px; line-height: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tt-stat-l { font-size: 12px; font-weight: 700; color: var(--ink-muted); }
.tt-stat-main .tt-stat-l { color: var(--on-pitch); opacity: .9; }
.tt-quick { display: flex; gap: 8px; padding: 0 16px 8px; overflow-x: auto; }
.tt-quick .pl-chip { flex: none; }

/* Times */
.tt-stack { display: flex; flex-direction: column; gap: 12px; }
.tt-stack-s { display: flex; flex-direction: column; gap: 10px; }
.tt-gk { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--pitch-100); color: var(--pitch-700); font-weight: 700; font-size: 14px; }
.tt-bench { background: var(--surface-000); border: 1.5px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 12px 16px; }
.tt-bench-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
.tt-bench-title .pl-icon { font-size: 18px; color: var(--ink-muted); }
.tt-bench-names { margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--ink-muted); }
.tt-row { display: flex; gap: 10px; }

/* Regras */
.tt-seg { display: flex; background: var(--surface-200); border-radius: var(--radius-pill); padding: 4px; gap: 4px; }

   *  3. características — médias de Ataque/Defesa/Velocidade/Habilidade parecidas

    var good = runs.filter(function (x) { return x.cost <= bestC + Math.max(0.4, bestC * 0.15); });
    var pick = good.length ? good[Math.floor(rnd() * good.length)] : { assign: [], cost: 0 };

    var teams = [];
    for (var i2 = 0; i2 < T; i2++) teams.push({ players: [], goalkeeper: teamGks[i2] ? teamGks[i2].name : null });
    pool.forEach(function (x, i) { teams[pick.assign[i]].players.push(x); });

    teams.sort(function (a, b) { return b.players.length - a.players.length; });
